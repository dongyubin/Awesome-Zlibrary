<!DOCTYPE html>
<html>
<head>
    <title>Convert SVG to PNG</title>
</head>
<body>
    <h1>Convert SVG to PNG</h1>
    <img src="files/zlibrary-icon.svg" id="svgImage" style="display: none;">
    <canvas id="canvas" style="display: none;"></canvas>
    <button onclick="convertToPNG()">Convert to PNG</button>
    <a id="downloadLink" style="display: none;">Download PNG</a>

    <script>
        function convertToPNG() {
            const svg = document.getElementById('svgImage');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Create an image from SVG
            const img = new Image();
            img.onload = function() {
                canvas.width = 48;
                canvas.height = 48;
                ctx.drawImage(img, 0, 0);

                // Convert to PNG
                const png = canvas.toDataURL('image/png');
                document.getElementById('downloadLink').href = png;
                document.getElementById('downloadLink').download = 'zlibrary-icon.png';
                document.getElementById('downloadLink').style.display = 'inline';
                document.getElementById('downloadLink').textContent = 'Download zlibrary-icon.png';
            };
            img.src = 'files/zlibrary-icon.svg';
        }
    </script>
</body>
</html>
